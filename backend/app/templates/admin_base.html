<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>{{ title or '后台管理' }}</title>
  <style>
    :root { --bg:#f4f6fb; --card:#fff; --primary:#2563eb; --muted:#64748b; --border:#e2e8f0; --success:#16a34a; --warn:#f59e0b; --danger:#ef4444; }
    * { box-sizing:border-box; }
    body { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin:0; background:var(--bg); color:#0f172a; }
    header { background:var(--card); border-bottom:1px solid var(--border); padding:14px 24px; position:sticky; top:0; z-index:10; box-shadow:0 1px 2px rgba(0,0,0,.04); }
    nav { display:flex; gap:16px; align-items:center; }
    nav a { color:var(--muted); text-decoration:none; font-weight:600; padding:8px 10px; border-radius:8px; }
    nav a.active { color:var(--primary); background:rgba(37,99,235,0.08); }
    .container { max-width:1200px; margin:24px auto 32px; padding:0 20px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; box-shadow:0 6px 18px rgba(15,23,42,0.05); }
    h1 { margin:0 0 16px; font-size:22px; }
    h3 { margin:0 0 12px; }
    table { width:100%; border-collapse:collapse; margin-top:12px; }
    th, td { padding:10px 12px; border-bottom:1px solid var(--border); font-size:14px; text-align:left; }
    th { background:#f8fafc; color:#0f172a; }
    tr:hover td { background:#f9fbff; }
    form.inline { display:inline-block; margin:0; }
    .status-label { padding:4px 8px; border-radius:999px; font-size:12px; font-weight:600; color:#0f172a; background:#e2e8f0; }
    .status-available { background:#dcfce7; color:#166534; }
    .status-reserved { background:#fef9c3; color:#854d0e; }
    .status-sold { background:#fee2e2; color:#991b1b; }
    .status-off_shelf { background:#e2e8f0; color:#475569; }
    .actions button { margin:0 4px 4px 0; }
    input, select, button { font:inherit; }
    input, select { padding:9px 10px; border:1px solid var(--border); border-radius:8px; background:#fff; }
    input:focus, select:focus { outline:2px solid rgba(37,99,235,0.25); border-color:var(--primary); }
    button { padding:9px 12px; border:none; border-radius:8px; cursor:pointer; font-weight:600; color:#fff; background:var(--primary); }
    button.secondary { background:#0f172a; color:#fff; }
    button.danger { background:var(--danger); }
    button:disabled { opacity:.55; cursor:not-allowed; }
    footer { text-align:center; padding:24px 0 32px; color:var(--muted); font-size:12px; }
    .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="/admin" class="{% if active == 'books' %}active{% endif %}">书籍管理</a>
      <a href="/admin/categories" class="{% if active == 'categories' %}active{% endif %}">分类管理</a>
      <a href="/admin/users" class="{% if active == 'users' %}active{% endif %}">用户管理</a>
      <a href="/admin/orders" class="{% if active == 'orders' %}active{% endif %}">订单管理</a>
      <a href="/admin/delivery-tasks" class="{% if active == 'delivery' %}active{% endif %}">配送订单管理</a>
    </nav>
  </header>
  <div class="container card">
    <h1>{{ page_title }}</h1>
    {% block content %}{% endblock %}
  </div>
  <footer>DHU Secondhand © {{ year }}</footer>
</body>
</html>
